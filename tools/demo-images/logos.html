<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Hamista demo logos</title>
<style>
@font-face { font-family: "Vazirmatn"; src: url(vazirmatn-arabic.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Vazirmatn"; src: url(vazirmatn-latin.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Doran"; src: url(../../wp/hamista-core/assets/fonts/library/doran/doran-700.woff2) format("woff2"); font-weight: 700; }
.word.doran { font-family: "Doran", serif; font-weight: 700; font-size: 84px; }
@font-face { font-family: "Doran"; src: url(../../wp/hamista-core/assets/fonts/library/doran/doran-300.woff2) format("woff2"); font-weight: 300; }
.word.doran-thin { font-family: "Doran", serif; font-weight: 300; font-size: 88px; letter-spacing: .01em; }
html, body { margin: 0; background: transparent; }
#logo { display: inline-flex; align-items: center; gap: 22px; padding: 12px 8px; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
.word { font-size: 92px; font-weight: 900; line-height: 1; letter-spacing: 0; }
.sub { display: block; text-align: right; margin-top: 10px; font: 700 22px/1 ui-monospace, Menlo, monospace; letter-spacing: .32em; direction: ltr; opacity: .6; }
svg { flex: none; display: block; }
</style>
</head>
<body>
<div id="logo"></div>
<script>
const q = new URLSearchParams(location.search);
const id = q.get('id'), dark = q.get('dark') === '1';
const ink = dark ? '#f4f2ee' : '#14121a';
document.documentElement.style.setProperty('--ink', ink);
const L = {
	spark: () => `<svg width="74" height="74" viewBox="0 0 74 74"><path d="M37 2c3 20 15 32 35 35-20 3-32 15-35 35-3-20-15-32-35-35 20-3 32-15 35-35Z" fill="#0052ff"/></svg><span class="word">هامیستا</span>`,
	agency: () => `<svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="28" fill="${dark ? '#9084ff' : '#5821df'}"/><path d="M14 52h16l8-20 12 36 10-26 6 10h16" fill="none" stroke="#c6f135" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="word">تپش</span>`,
	industrial: () => `<svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="40" fill="${dark ? '#2c3139' : '#e0e5ec'}" stroke="${dark ? '#3a414b' : '#b8c1ce'}" stroke-width="3"/><circle cx="43" cy="43" r="26" fill="none" stroke="${ink}" stroke-width="6" stroke-dasharray="120 44" transform="rotate(-210 43 43)"/><circle cx="43" cy="43" r="9" fill="#ff4757"/><circle cx="43" cy="43" r="16" fill="#ff4757" opacity=".18"/></svg><span><span class="word">هامون</span><span class="sub">HAMOON IND.</span></span>`,
	honey: () => `<svg width="86" height="96" viewBox="0 0 86 96"><path d="M43 2 82 24.5v47L43 94 4 71.5v-47Z" fill="#f0b429"/><path d="M43 26c7 9 13 17 13 25a13 13 0 0 1-26 0c0-8 6-16 13-25Z" fill="${dark ? '#140d06' : '#2a1a0b'}"/></svg><span class="word">شهدینه</span>`,
	flux: () => `<svg width="92" height="70" viewBox="0 0 92 70"><g fill="none" stroke="${dark ? '#ef7440' : '#e2622b'}" stroke-linecap="round"><path d="M4 30C20 10 34 50 50 30S78 10 88 22" stroke-width="5"/><path d="M4 44C20 24 34 64 50 44S78 24 88 36" stroke-width="3.5" stroke-opacity=".7"/><path d="M4 58C20 38 34 78 50 58S78 38 88 50" stroke-width="2.4" stroke-opacity=".45"/></g></svg><span class="word">سیال</span>`,
	roshd: () => `<svg width="84" height="84" viewBox="0 0 84 84"><rect width="84" height="84" rx="22" fill="${dark ? '#3aa594' : '#1d7a6c'}"/><path d="M18 60c14 0 22-6 28-16s12-18 22-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="66" cy="24" r="7" fill="#e46f55"/></svg><span class="word">رشد</span>`,
	zarrinbal: () => `<svg width="96" height="64" viewBox="0 0 96 64"><defs><linearGradient id="zg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6f30"/><stop offset=".5" stop-color="#f3dfa8"/><stop offset="1" stop-color="#a8843f"/></linearGradient></defs><g fill="none" stroke="url(#zg)" stroke-linecap="round"><path d="M4 50C30 46 60 30 92 6" stroke-width="3"/><path d="M14 58C38 54 64 40 90 18" stroke-width="2" stroke-opacity=".8"/><path d="M26 62C46 59 68 48 88 30" stroke-width="1.4" stroke-opacity=".6"/></g></svg><span class="word doran-thin">زرین‌بال</span>`,
	hekmat: () => `<svg width="82" height="82" viewBox="0 0 82 82"><g fill="none" stroke="${dark ? '#d8b46c' : '#8a6a2f'}"><path d="M41 3 52 30 79 41 52 52 41 79 30 52 3 41 30 30Z" stroke-width="3"/><path d="M14 14l27 11 27-11-11 27 11 27-27-11-27 11 11-27Z" stroke-width="2" stroke-opacity=".7"/><circle cx="41" cy="41" r="9" stroke-width="3"/></g></svg><span class="word doran">خانه‌ی حکمت</span>`,
	parvazyar: () => `<svg width="84" height="84" viewBox="0 0 84 84"><rect width="84" height="84" rx="20" fill="${dark ? '#2459ff' : '#0a1633'}"/><path d="M18 62C30 60 50 46 64 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10"/><path d="m56 20 10-2-2 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="62" r="5" fill="${dark ? '#fff' : '#2459ff'}"/></svg><span class="word">پروازیار</span>`,
	rahnavard: () => `<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="${ink}" stroke-width="4"/><path d="M8 50h68" stroke="${ink}" stroke-width="4"/><path d="M24 50a18 18 0 0 1 36 0" fill="#2bb3c4"/><path d="M18 62h48M28 72h28" stroke="${ink}" stroke-width="4" stroke-opacity=".35"/></svg><span class="word">ره‌نورد</span>`,
	nomad: () => `<svg width="88" height="88" viewBox="0 0 88 88"><path d="M44 2 86 44 44 86 2 44Z" fill="#b5532f"/><path d="M44 18 70 44 44 70 18 44Z" fill="${dark ? '#e3a72f' : '#2e3a5c'}"/><path d="M44 32 56 44 44 56 32 44Z" fill="${dark ? '#17130f' : '#f3ede2'}"/></svg><span class="word">کوچ</span>`,
};
document.getElementById('logo').innerHTML = L[id]();
document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
