<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Hamista demo logos</title>
<style>
@font-face { font-family: "Vazirmatn"; src: url(vazirmatn-arabic.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Vazirmatn"; src: url(vazirmatn-latin.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Doran"; src: url(../../wp/hamista-core/assets/fonts/library/doran/doran-700.woff2) format("woff2"); font-weight: 700; }
.word.doran { font-family: "Doran", serif; font-weight: 700; font-size: 84px; }
@font-face { font-family: "Doran"; src: url(../../wp/hamista-core/assets/fonts/library/doran/doran-300.woff2) format("woff2"); font-weight: 300; }
.word.doran-thin { font-family: "Doran", serif; font-weight: 300; font-size: 88px; letter-spacing: .01em; }
@font-face { font-family: "Peyda"; src: url(../../wp/hamista-core/assets/fonts/library/peyda/peyda-300.woff2) format("woff2"); font-weight: 300; }
@font-face { font-family: "Doran"; src: url(../../wp/hamista-core/assets/fonts/library/doran/doran-500.woff2) format("woff2"); font-weight: 500; }
.word.doran-med { font-family: "Doran", serif; font-weight: 500; font-size: 88px; }
@font-face { font-family: "Pinar"; src: url(../../wp/hamista-core/assets/fonts/library/pinar/pinar-variable.woff2) format("woff2"); font-weight: 300 900; }
.word.pinar { font-family: "Pinar", sans-serif; font-weight: 450; font-size: 90px; }
@font-face { font-family: "Ravagh"; src: url(../../wp/hamista-core/assets/fonts/library/ravagh/ravagh-400.woff2) format("woff2"); font-weight: 400; }
.word.ravagh { font-family: "Ravagh", sans-serif; font-weight: 400; font-size: 86px; }
@font-face { font-family: "Peyda"; src: url(../../wp/hamista-core/assets/fonts/library/peyda/peyda-700.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Lahzeh"; src: url(../../wp/hamista-core/assets/fonts/library/lahzeh/lahzeh-600.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "IRANYekan"; src: url(../../wp/hamista-core/assets/fonts/library/iranyekan/iranyekan-500.woff2) format("woff2"); font-weight: 500; }
.word.yekan { font-family: "IRANYekan", sans-serif; font-weight: 500; font-size: 84px; }
.word.lahzeh { font-family: "Lahzeh", sans-serif; font-weight: 600; font-size: 86px; }
.word.peyda-bold { font-family: "Peyda", sans-serif; font-weight: 700; font-size: 84px; }
.word.peyda-thin { font-family: "Peyda", sans-serif; font-weight: 300; font-size: 90px; }
.sub.thin { font: 400 14px/1 "Vazirmatn", sans-serif; letter-spacing: .62em; opacity: .5; margin-top: 12px; }
html, body { margin: 0; background: transparent; }
#logo { display: inline-flex; align-items: center; gap: 22px; padding: 12px 8px; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
.word { font-size: 92px; font-weight: 900; line-height: 1; letter-spacing: 0; }
.sub { display: block; text-align: right; margin-top: 10px; font: 700 22px/1 ui-monospace, Menlo, monospace; letter-spacing: .32em; direction: ltr; opacity: .6; }
svg { flex: none; display: block; }
</style>
</head>
<body>
<div id="logo"></div>
<script>
const q = new URLSearchParams(location.search);
const id = q.get('id'), dark = q.get('dark') === '1';
const ink = dark ? '#f4f2ee' : '#14121a';
document.documentElement.style.setProperty('--ink', ink);
const L = {
	spark: () => `<svg width="60" height="60" viewBox="0 0 60 60"><path d="M30 2c2 16 12 26 28 28-16 2-26 12-28 28-2-16-12-26-28-28 16-2 26-12 28-28Z" fill="none" stroke="${dark ? '#93abf0' : '#2b4aa0'}" stroke-width="3" stroke-linejoin="round"/></svg><span><span class="word doran-med">جرقه</span><span class="sub thin">SPARK ACADEMY</span></span>`,
	agency: () => `<svg width="64" height="64" viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" fill="none" stroke="${ink}" stroke-width="4"/><path d="M12 36h10l6-14 8 24 6-16 4 6h6" fill="none" stroke="${dark ? '#ef7a62' : '#c9452c'}" stroke-width="4.5" stroke-linejoin="miter"/></svg><span><span class="word peyda-bold">تپش</span><span class="sub thin">TAPESH STUDIO</span></span>`,
	industrial: () => `<svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="31" fill="none" stroke="${ink}" stroke-width="4"/><path d="M14 46a23 23 0 1 1 42 0" fill="none" stroke="${ink}" stroke-width="3" stroke-opacity=".35"/><path d="M35 35 21 23" stroke="${dark ? '#e2444c' : '#c3262f'}" stroke-width="5" stroke-linecap="square"/><rect x="31" y="31" width="8" height="8" fill="${ink}"/></svg><span><span class="word peyda-bold">هامون</span><span class="sub thin">HAMOON INDUSTRIES</span></span>`,
	honey: () => `<svg width="62" height="70" viewBox="0 0 62 70"><path d="M31 3 58 18.5v33L31 67 4 51.5v-33Z" fill="none" stroke="${dark ? '#e0a043' : '#b0701a'}" stroke-width="3.5"/><path d="M31 22c5.5 7 10 13 10 19a10 10 0 0 1-20 0c0-6 4.5-12 10-19Z" fill="${dark ? '#e0a043' : '#b0701a'}"/></svg><span><span class="word doran-med">شهدینه</span><span class="sub thin">SHAHDINEH MOUNTAIN HONEY</span></span>`,
	negareh: () => `<svg width="58" height="58" viewBox="0 0 58 58"><path d="M29 3c2 14 9 21 26 26-17 5-24 12-26 26-2-14-9-21-26-26 17-5 24-12 26-26Z" fill="${dark ? '#c6f432' : '#4d6d00'}"/><circle cx="47" cy="11" r="3" fill="${ink}" fill-opacity=".5"/></svg><span><span class="word peyda-bold">نگاره</span><span class="sub thin">NEGAREH DIGITAL ART</span></span>`,
	clinic: () => `<svg width="56" height="74" viewBox="0 0 56 74"><g fill="none" stroke="${dark ? '#7fb5a5' : '#2f6b5c'}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 4C42 14 50 27 47 40c-2 9-9 15-19 17C18 55 11 49 9 40 6 27 14 14 28 4Z"/><path d="M28 13v59"/><path d="M28 30l9-7M28 41l11-8M28 30l-9-7M28 41l-11-8" stroke-width="2.2" stroke-opacity=".7"/></g></svg><span><span class="word yekan">سپیدار</span><span class="sub thin">SEPIDAR CLINIC</span></span>`,
	flux: () => `<svg width="66" height="66" viewBox="0 0 66 66"><path d="M3 3h60v60H3Z" fill="none" stroke="${ink}" stroke-width="3" stroke-opacity=".28"/><path d="M10 56C24 56 26 14 52 12" fill="none" stroke="${dark ? '#ef7440' : '#e2622b'}" stroke-width="4.5" stroke-linecap="round"/><path d="M10 56h16" stroke="${ink}" stroke-width="2" stroke-opacity=".5"/><circle cx="26" cy="56" r="3" fill="${ink}"/><path d="m52 6 6 6-6 6-6-6Z" fill="${ink}"/></svg><span><span class="word lahzeh">سیال</span><span class="sub thin">SAYAL MOTION STUDIO</span></span>`,
	roshd: () => `<svg width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="30" fill="none" stroke="${ink}" stroke-width="2.5" stroke-opacity=".3"/><path d="M14 44l11-10 9 6 16-17" fill="none" stroke="${dark ? '#3aa594' : '#1d7a6c'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="23" r="3.6" fill="${dark ? '#f08a71' : '#e46f55'}"/></svg><span><span class="word peyda-bold">رشد</span><span class="sub thin">ROSHD CONSULTING</span></span>`,
	zarrinbal: () => `<svg width="96" height="64" viewBox="0 0 96 64"><defs><linearGradient id="zg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6f30"/><stop offset=".5" stop-color="#f3dfa8"/><stop offset="1" stop-color="#a8843f"/></linearGradient></defs><g fill="none" stroke="url(#zg)" stroke-linecap="round"><path d="M4 50C30 46 60 30 92 6" stroke-width="3"/><path d="M14 58C38 54 64 40 90 18" stroke-width="2" stroke-opacity=".8"/><path d="M26 62C46 59 68 48 88 30" stroke-width="1.4" stroke-opacity=".6"/></g></svg><span class="word doran-thin">زرین‌بال</span>`,
	hekmat: () => `<svg width="82" height="82" viewBox="0 0 82 82"><g fill="none" stroke="${dark ? '#d8b46c' : '#8a6a2f'}"><path d="M41 3 52 30 79 41 52 52 41 79 30 52 3 41 30 30Z" stroke-width="3"/><path d="M14 14l27 11 27-11-11 27 11 27-27-11-27 11 11-27Z" stroke-width="2" stroke-opacity=".7"/><circle cx="41" cy="41" r="9" stroke-width="3"/></g></svg><span class="word doran">خانه‌ی حکمت</span>`,
	parvazyar: () => `<svg width="74" height="60" viewBox="0 0 74 60"><path d="M4 52C22 50 46 36 66 10" fill="none" stroke="${ink}" stroke-width="2.5" stroke-opacity=".35" stroke-dasharray="1 7" stroke-linecap="round"/><path d="M58 8l10 1-3 9" fill="none" stroke="${dark ? '#7f9cff' : '#2459ff'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="52" r="4" fill="${dark ? '#7f9cff' : '#2459ff'}"/></svg><span><span class="word peyda-bold">پروازیار</span><span class="sub thin">PARVAZYAR</span></span>`,
	rahnavard: () => `<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="none" stroke="${ink}" stroke-width="4"/><path d="M8 50h68" stroke="${ink}" stroke-width="4"/><path d="M24 50a18 18 0 0 1 36 0" fill="#2bb3c4"/><path d="M18 62h48M28 72h28" stroke="${ink}" stroke-width="4" stroke-opacity=".35"/></svg><span class="word">ره‌نورد</span>`,
	sazeh: () => `<svg width="78" height="84" viewBox="0 0 78 84"><path d="M8 80V36a31 31 0 0 1 62 0v44" fill="none" stroke="${ink}" stroke-width="3.5"/><path d="M22 80v-9h11v-9h11v-9h11v-9" fill="none" stroke="${dark ? '#c4a27a' : '#8b6b45'}" stroke-width="3.5" stroke-linejoin="miter"/><path d="M2 80h74" stroke="${ink}" stroke-width="3.5"/></svg><span><span class="word peyda-thin">سازه</span><span class="sub thin">SAZEH STUDIO</span></span>`,
	dadgar: () => `<svg width="80" height="84" viewBox="0 0 80 84"><path d="M6 26 40 6l34 20Z" fill="${dark ? '#c2665a' : '#7b2d26'}"/><path d="M10 32h60M10 74h60M4 80h72" stroke="${ink}" stroke-width="3.5"/><path d="M18 38v30M32 38v30M48 38v30M62 38v30" stroke="${ink}" stroke-width="3.5"/></svg><span><span class="word doran-med">دادگر</span><span class="sub thin">DADGAR LAW FIRM</span></span>`,
	gelineh: () => `<svg width="86" height="70" viewBox="0 0 86 70"><path d="M4 22h78a39 39 0 0 1-78 0Z" fill="${dark ? '#d07a58' : '#a85a3c'}"/><path d="M4 22h78" stroke="${dark ? '#9fb3a1' : '#5f7464'}" stroke-width="4"/><path d="M14 34a29 29 0 0 0 58 0" fill="none" stroke="${dark ? '#9fb3a1' : '#5f7464'}" stroke-width="3" stroke-opacity=".7"/><rect x="30" y="61" width="26" height="5" rx="1" fill="${ink}"/></svg><span><span class="word pinar">گلینه</span><span class="sub thin">GELINEH CERAMICS</span></span>`,
	nomad: () => `<svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 2 62 32 32 62 2 32Z" fill="${dark ? '#c8644a' : '#8e2f25'}"/><path d="M32 16 48 32 32 48 16 32Z" fill="${dark ? '#16130f' : '#f2ece2'}"/><path d="M32 24 40 32 32 40 24 32Z" fill="${dark ? '#c99a3e' : '#2e3a5c'}"/></svg><span><span class="word ravagh">کوچ</span><span class="sub thin">KOOCH NOMADIC GOODS</span></span>`,
};
document.getElementById('logo').innerHTML = L[id]();
document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
